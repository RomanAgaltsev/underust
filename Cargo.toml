[workspace]
resolver = "3"
# `tasks/*/*` is deliberately absent until the first task crate exists (Task 17 adds it).
# Cargo treats a glob that matches nothing as a LITERAL path and fails to load it, so an
# empty `tasks/` directory does not help -- the pattern must have at least one match.
members = ["crates/*", "tasks/*/*"]

[workspace.package]
edition      = "2024"
rust-version = "1.98"
license      = "MIT"
repository   = "https://github.com/RomanAgaltsev/underust"
authors      = ["Roman Agaltsev <roman-agalcev@yandex.ru>"]

[workspace.dependencies]
underust-core  = { path = "crates/underust-core" }
underust-grade = { path = "crates/underust-grade" }
anyhow     = "1"
base64     = "0.23"
clap       = { version = "4.6", features = ["derive"] }
# default-features = false is load-bearing: the default set includes `runtime_detection`,
# which can reach for a system zlib. No dependency may require a C compiler (spec 9.4).
flate2     = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn        = { version = "2", features = ["full", "visit", "parsing"] }
thiserror  = "2"
toml       = "1"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs    = "warn"
unexpected_cfgs = "warn"
