version: '3'

vars:
  # The harness crates. Deliberately NOT --workspace: a BUILD task ships a todo!() stub,
  # so its graded tests are SUPPOSED to fail and --workspace can never be green once any
  # task exists. Task crates are covered by `stubs` and `prove` instead.
  HARNESS: -p underust-core -p underust-grade -p underust

tasks:
  fmt:
    desc: Gate 1 -- formatting
    cmds:
      - cargo fmt --all --check

  lint:
    desc: Gate 2 -- clippy. Review drills stay excluded or the linter names their defects.
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  stubs:
    desc: Gate 3 -- every task stub compiles
    cmds:
      - cargo run -q -p underust -- ci-stubs

  prove:
    desc: Gate 4 -- every sealed solution unseals and passes, skips reported
    # `leak` depends on this for its log, and `ci` also lists it. Without `run: once` the
    # whole gate executes twice per ci run.
    run: once
    cmds:
      - cargo run -q -p underust -- prove | tee prove.log

  validate:
    desc: Gate 5 -- manifests, ids and directories agree
    cmds:
      - cargo run -q -p underust -- validate

  radar:
    desc: Gate 6 -- radar invalidations name real tasks
    cmds:
      - cargo run -q -p underust -- radar-check

  leak:
    desc: Gate 7 -- no sealed text in a log that will be public
    deps: [prove]
    cmds:
      - cargo run -q -p underust -- leak-check prove.log

  test:
    desc: Harness unit and integration tests
    cmds:
      - cargo test {{.HARNESS}} -- --test-threads=1

  ci:
    desc: All seven gates plus the harness tests
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: stubs
      - task: validate
      - task: radar
      - task: prove
      - task: leak

  doctor:
    desc: What can this machine grade, and how to fix what it cannot
    cmds:
      - cargo run -q -p underust -- doctor

  docker:build:
    cmds:
      - docker build -t underust-canonical .

  docker:ci:
    desc: Run the gates inside the canonical image
    deps: [docker:build]
    cmds:
      - docker run --rm -v "$PWD":/w -w /w underust-canonical task ci
