name: pr-title

# release-please bumps on feat/fix only. A PR titled `import:` or `chore:` appears in the
# changelog WITHOUT a version bump, so anything that adds tasks must be `feat(tasks): ...`.
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
