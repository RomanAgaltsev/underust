name: release

on:
  push:
    branches: [main]

# This block elevates above the repository's read-only GITHUB_TOKEN default. Verified in
# undergo: the read-only default does NOT block release-please, but the repository setting
# "Allow GitHub Actions to create and approve pull requests" DOES -- it must be on, or
# release-please fails after creating its branch.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
